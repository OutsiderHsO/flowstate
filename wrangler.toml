# Build settings for Cloudflare Pages.
#
# Connecting the repo in the dashboard also works, but committing this file
# means the settings live with the code instead of in one person's account
# settings. Cloudflare picks these up automatically.
#
# Docs: https://developers.cloudflare.com/pages/configuration/build-configuration/

# Astro 6 needs Node 22+; Cloudflare's default image may be newer or older,
# so pin it explicitly.
[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "11.8.0"

[build]
# pnpm reads pnpm-workspace.yaml from the repo root for node-linker=hoisted,
# so no install flags are needed here.
command = "pnpm build"
publish = "dist"

# The site is fully static; there is no server runtime to configure.
