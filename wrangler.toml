# Cloudflare Worker with static assets.
#
# Why this file looks the way it does — the deploy log tells the whole story:
#
#   "Executing user deploy command: npx wrangler deploy"
#   "[ERROR] Missing entry-point to Worker script or to assets directory"
#   "[WARNING] Unexpected fields found in build field: environment,publish"
#
# `npx wrangler deploy` is a Workers command, not a Pages one. Wrangler read
# this file, rejected the Pages-only `[build]` / `[build.environment]` keys,
# and then had nothing to deploy because there was no script and no `[assets]`.
# That is why the URL served an empty 404 despite the build succeeding.
#
# Astro already produces a complete static site in dist/, so no worker script
# is needed — Workers serves the folder directly.
#
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "flowstate"
compatibility_date = "2026-10-23"

[assets]
directory = "./dist"

# Serve /zh/about/ from dist/zh/about/index.html regardless of trailing slash.
html_handling = "auto-trailing-slash"

# Unknown paths get dist/404.html instead of an empty response.
not_found_handling = "404-page"
