packages: []

# Hoisted layout: pnpm's default symlinking overflowed the stack on this
# machine, and hoisted is also easier to reason about in CI.
nodeLinker: hoisted

# Build scripts are blocked by default (supply-chain safety).
# Astro needs these two: esbuild (bundler) and sharp (image optimisation).
allowBuilds:
  esbuild: true
  sharp: true
